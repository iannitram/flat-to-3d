name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # The project is SteamOS-only (Linux): the engine and the Decky plugin run there; the game
    # DLLs build on the owner's Z13 (ruling 21). So CI runs on Linux only.
    # Self-hosted Linux runner (R29): an actions-runner Ubuntu 24.04 container
    # with fewer preinstalled tools than ubuntu-latest, so install the C toolchain rustc links with.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - env:
          DEBIAN_FRONTEND: noninteractive
        run: SUDO=$(command -v sudo || true); $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends build-essential curl ca-certificates
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: "clippy, rustfmt" }
      - name: fmt
        run: |
          cargo fmt --manifest-path inject/Cargo.toml --check \
            || { echo "::error::FAIL fmt: fix: cargo fmt --manifest-path inject/Cargo.toml"; exit 1; }
      - name: clippy
        run: |
          cargo clippy --manifest-path inject/Cargo.toml --all-targets -- -D warnings \
            || { echo "::error::FAIL clippy: fix: run cargo clippy --manifest-path inject/Cargo.toml --all-targets -- -D warnings and fix each lint it names"; exit 1; }
      - run: cargo build --manifest-path inject/Cargo.toml
      - run: cargo test --manifest-path inject/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile decky/main.py

  app:
    # The desktop app (iced, Desktop Mode): a crate that links the engine by path. The system
    # libraries iced needs are installed first on this Ubuntu 24.04 runner. No WebKitGTK, no Node.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - env:
          DEBIAN_FRONTEND: noninteractive
        run: SUDO=$(command -v sudo || true); $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends build-essential curl ca-certificates pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: "clippy, rustfmt" }
      - name: fmt
        run: |
          cargo fmt --manifest-path app/Cargo.toml --check \
            || { echo "::error::FAIL fmt: fix: cargo fmt --manifest-path app/Cargo.toml"; exit 1; }
      - name: clippy
        run: |
          cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings \
            || { echo "::error::FAIL clippy: fix: run cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings and fix each lint it names"; exit 1; }
      - run: cargo test --manifest-path app/Cargo.toml
      - run: cargo check --manifest-path app/Cargo.toml
