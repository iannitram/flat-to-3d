name: check

on:
  push:
  pull_request:

jobs:
  engine:
    # The engine runs on SteamOS (Linux) only; the game DLLs build on the owner's Z13 (ruling 21).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 -m py_compile decky/main.py
