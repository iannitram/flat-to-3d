[package]
name = "flat3d-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Flat to 3D's desktop app: the iced window for Setup, Headset, Games and Logs"
publish = false

[lib]
name = "flat3d_app"
path = "src/lib.rs"

[[bin]]
name = "flat3d-app"
path = "src/main.rs"

# The engine, linked directly (no command runs through a shell): the pages read its types.
# iced (MIT): the GUI toolkit, in Desktop Mode (no WebKitGTK).
[dependencies]
flat3d-inject = { workspace = true }
iced = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
