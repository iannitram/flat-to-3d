[package]
name = "flat3d-aw2-proxy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

# Output: version.dll, a do-nothing proxy for the system version.dll. It logs one
# line when loaded and forwards every export to the system copy. See
# docs/notes/research/games/epic-alan-wake-2.md (test 2).
[lib]
name = "version"
path = "src/lib.rs"
# The rlib makes `cargo test` build the cdylib too; the test loads that DLL.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
