schema = 1
name = "tools-build"
title = "Tools Build"
q = "Q1"
issues = [127]
device = ["build-box"]
needs = ["WP-22"]
done_when = "the script runs on a clean Deck and adb exists and runs `version` (needs-owner-device). Ruling 42 makes adb the only tool, so the APK source question is void."

[[step]]
id = "build"
kind = "cmd"
who = "script"
text = "Build pinned Android tools."
run = ["distrobox", "enter", "{build_box}", "--", "{repo}/packaging/build-tools.sh"]
timeout = 3600

[[step]]
id = "adb-version"
kind = "cmd"
who = "script"
text = "Check adb version."
run = ["{repo}/dist/tools/adb", "version"]
expect = "37\\.0\\.0"

[[step]]
id = "checksums"
kind = "cmd"
who = "script"
text = "Confirm pinned outputs are recorded."
run = ["grep", "-E", " adb$", "{repo}/dist/tools/SHA256SUMS"]
